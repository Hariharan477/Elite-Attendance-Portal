pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File(rootDir, 'local.properties')
        if (file.exists()) {
            file.withReader('UTF-8') { reader -> properties.load(reader) }
        }
        def flutterSdkDir = properties.getProperty('flutter.sdk')
        assert flutterSdkDir != null : "flutter.sdk not set in local.properties"
        return flutterSdkDir
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
